<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POS Demo B — Quick-add modal</title>
<style>
  :root{
    --blue:#0080ff; --blue-d:#0061C2;
    --green:#03C03C; --green-d:#018A29;
    --purple:#8A00C2; --purple-d:#62008C;
    --ink:#0B1020; --cream:#F7FAF4;
    --line:#e3e8ef; --line2:#cdd5e0; --muted:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);height:100vh;overflow:hidden}
  .topbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#fff;border-bottom:2px solid var(--line)}
  .topbar h1{font-size:18px;font-weight:700}
  .badge{font-size:11px;font-weight:700;color:var(--purple);background:#8a00c214;padding:3px 8px;border-radius:4px}
  .layout{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 56px)}
  .browser{padding:18px;overflow-y:auto}
  .search{position:relative;margin-bottom:16px}
  .search input{width:100%;height:48px;border:2px solid var(--line2);border-radius:4px;padding:0 14px 0 40px;font-size:15px;outline:none}
  .search input:focus{border-color:var(--blue)}
  .search svg{position:absolute;left:12px;top:14px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{background:#fff;border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:.12s;position:relative}
  .tile:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:0 6px 16px rgba(138,0,194,.12)}
  .thumb{aspect-ratio:1;background:linear-gradient(135deg,#eef2f7,#dde6f2);display:flex;align-items:center;justify-content:center;font-size:42px}
  .tile .meta{padding:10px}
  .tile .nm{font-size:13px;font-weight:600;line-height:1.25;height:33px;overflow:hidden}
  .tile .pr{font-size:14px;font-weight:800;margin-top:4px}
  .tile .tag{position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;color:#fff;background:var(--purple);padding:3px 6px;border-radius:3px}

  /* TICKET — ultra compact, no inline controls */
  .ticket{background:#fff;border-left:2px solid var(--line);display:flex;flex-direction:column;height:100%}
  .ticket h2{font-size:15px;font-weight:800;padding:16px 16px 10px}
  .lines{flex:1;overflow-y:auto;padding:0 12px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .line{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
  .lt{width:36px;height:36px;border-radius:5px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .lc{flex:1;min-width:0}
  .lc .nm{font-size:13px;font-weight:700;line-height:1.2}
  .lc .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .lc .qp{font-size:12px;color:var(--ink);margin-top:3px;font-weight:600}
  .lp{text-align:right;font-weight:800;font-size:13px;font-family:monospace}
  .rm{color:#ef4444;cursor:pointer;background:none;border:none;font-size:15px}
  .summary{border-top:2px solid var(--line);padding:14px 16px}
  .srow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--muted)}
  .srow.total{color:var(--ink);font-weight:800;font-size:18px;border-top:2px solid var(--line);padding-top:10px;margin-top:4px}
  .cust{font-size:13px;color:var(--blue);font-weight:700;cursor:pointer;padding:10px 16px;border-top:2px dashed var(--line)}
  .create{margin:12px 16px 16px;width:calc(100% - 32px);height:54px;border:none;border-radius:6px;background:var(--green);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
  .create:hover{background:var(--green-d)}
  .note{font-size:11px;color:var(--muted);text-align:center;padding-bottom:10px}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(11,16,32,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:12px;width:420px;max-width:90vw;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .mhead{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:2px solid var(--line)}
  .mhead .lt{width:48px;height:48px;font-size:24px}
  .mhead .nm{font-size:16px;font-weight:800}
  .mhead .pr{font-size:13px;color:var(--muted);font-weight:600}
  .mbody{padding:20px}
  .optgroup{margin-bottom:18px}
  .optgroup .lbl{font-size:13px;font-weight:700;margin-bottom:8px}
  .optrow{display:flex;gap:8px;flex-wrap:wrap}
  .opt{padding:8px 16px;border:2px solid var(--line2);border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;background:#fff}
  .opt.sel{border-color:var(--blue);background:#0080ff14;color:var(--blue-d)}
  .qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .stepper{display:flex;align-items:center;border:2px solid var(--line2);border-radius:6px;overflow:hidden}
  .stepper button{width:40px;height:40px;border:none;background:#fff;font-size:18px;cursor:pointer}
  .stepper span{width:40px;text-align:center;font-weight:800}
  .mfoot{display:flex;gap:10px;padding:16px 20px;border-top:2px solid var(--line)}
  .mfoot button{flex:1;height:50px;border-radius:6px;font-size:15px;font-weight:800;cursor:pointer;border:none}
  .cancel{background:#fff;border:2px solid var(--line2)!important;color:var(--muted)}
  .add{background:var(--green);color:#fff}
  .add:hover{background:var(--green-d)}
</style>
</head>
<body>
  <div class="topbar">
    <h1>Point of Sale</h1>
    <span class="badge">DEMO B · Quick-add modal</span>
  </div>
  <div class="layout">
    <div class="browser">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="Search products…" />
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="ticket">
      <h2>Order ticket</h2>
      <div class="lines" id="lines"><div class="empty">Tap a product. Items with options pop a quick picker.</div></div>
      <div class="cust">＋ Add customer details</div>
      <div class="summary">
        <div class="srow"><span>Subtotal</span><span id="sub">RM 0.00</span></div>
        <div class="srow"><span>Shipping</span><span>RM 0.00</span></div>
        <div class="srow total"><span>Total</span><span id="tot">RM 0.00</span></div>
      </div>
      <button class="create">Create order</button>
      <div class="note">Clean ticket · options chosen in a focused modal</div>
    </div>
  </div>

  <!-- modal -->
  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="mhead"><div class="lt" id="mEmoji"></div><div><div class="nm" id="mName"></div><div class="pr" id="mPrice"></div></div></div>
      <div class="mbody" id="mBody"></div>
      <div class="mfoot"><button class="cancel" onclick="closeModal()">Cancel</button><button class="add" onclick="confirmAdd()">Add to order</button></div>
    </div>
  </div>

<script>
const products=[
  {id:1,n:"Dragon Keychain",p:25,e:"🐉",v:["S","M","L"],c:["Red","Blue","Green"]},
  {id:2,n:"Mini Ninja Figure",p:45,e:"🥷",v:["S","M","L"]},
  {id:3,n:"Custom Keyboard Clicker",p:40,e:"⌨️",cfg:true},
  {id:4,n:"Cat Planter Pot",p:38,e:"🐱"},
  {id:5,n:"Geometric Vase",p:55,e:"🏺",v:["S","L"]},
  {id:6,n:"Skull Dice Set",p:30,e:"💀",c:["Black","White","Glow"]},
  {id:7,n:"Phone Stand",p:22,e:"📱"},
  {id:8,n:"Articulated Octopus",p:48,e:"🐙",c:["Purple","Orange","Teal"]},
  {id:9,n:"Desk Cable Clip",p:12,e:"🔌"},
];
const g=document.getElementById('grid');
products.forEach(p=>{
  const d=document.createElement('div');d.className='tile';
  const hasOpts=p.v||p.c||p.cfg;
  d.innerHTML=`${hasOpts?`<span class="tag">${p.cfg?'CONFIG':'OPTIONS'}</span>`:''}<div class="thumb">${p.e}</div><div class="meta"><div class="nm">${p.n}</div><div class="pr">RM ${p.p.toFixed(2)}</div></div>`;
  d.onclick=()=>tap(p);
  g.appendChild(d);
});
const lines=[];let cur=null,sel={},qty=1;
function tap(p){
  if(!(p.v||p.c||p.cfg)){lines.push({...p,qty:1,sub:''});render();return;}
  cur=p;sel={};qty=1;
  document.getElementById('mEmoji').textContent=p.e;
  document.getElementById('mName').textContent=p.n;
  document.getElementById('mPrice').textContent='RM '+p.p.toFixed(2);
  const b=document.getElementById('mBody');b.innerHTML='';
  if(p.v)b.appendChild(group('Size',p.v.map(x=>'Size '+x)));
  if(p.c)b.appendChild(group('Colour',p.c));
  if(p.cfg)b.appendChild(group('Engraving text',['(type in real app)'],true));
  const q=document.createElement('div');q.className='optgroup';
  q.innerHTML=`<div class="lbl">Quantity</div><div class="qtyrow"><div class="stepper"><button onclick="mq(-1)">−</button><span id="mQty">1</span><button onclick="mq(1)">+</button></div></div>`;
  b.appendChild(q);
  document.getElementById('overlay').classList.add('show');
}
function group(name,opts,single){
  const d=document.createElement('div');d.className='optgroup';
  d.innerHTML=`<div class="lbl">${name}</div>`;
  const r=document.createElement('div');r.className='optrow';
  opts.forEach((o,i)=>{
    const s=document.createElement('div');s.className='opt'+(i===0?' sel':'');s.textContent=o;
    if(i===0)sel[name]=o;
    s.onclick=()=>{[...r.children].forEach(c=>c.classList.remove('sel'));s.classList.add('sel');sel[name]=o;};
    r.appendChild(s);
  });
  d.appendChild(r);return d;
}
function mq(d){qty=Math.max(1,qty+d);document.getElementById('mQty').textContent=qty;}
function confirmAdd(){
  lines.push({...cur,qty,sub:Object.values(sel).join(' · ')});
  closeModal();render();
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
function render(){
  const L=document.getElementById('lines');
  if(!lines.length){L.innerHTML='<div class="empty">Tap a product. Items with options pop a quick picker.</div>';update();return;}
  L.innerHTML='';
  lines.forEach((l,i)=>{
    const el=document.createElement('div');el.className='line';
    el.innerHTML=`<div class="lt">${l.e}</div><div class="lc"><div class="nm">${l.n}</div>${l.sub?`<div class="sub">${l.sub}</div>`:''}<div class="qp">${l.qty} × RM ${l.p.toFixed(2)}</div></div><div class="lp">RM ${(l.p*l.qty).toFixed(2)}</div><button class="rm" onclick="rm(${i})">✕</button>`;
    L.appendChild(el);
  });
  update();
}
function rm(i){lines.splice(i,1);render();}
function update(){const s=lines.reduce((a,l)=>a+l.p*l.qty,0);document.getElementById('sub').textContent='RM '+s.toFixed(2);document.getElementById('tot').textContent='RM '+s.toFixed(2);}
</script>
</body>
</html>
