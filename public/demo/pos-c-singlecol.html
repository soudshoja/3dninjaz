<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POS Demo C — Single column (phone / market stall)</title>
<style>
  :root{
    --blue:#0080ff; --blue-d:#0061C2;
    --green:#03C03C; --green-d:#018A29;
    --purple:#8A00C2; --purple-d:#62008C;
    --ink:#0B1020; --cream:#F7FAF4;
    --line:#e3e8ef; --line2:#cdd5e0; --muted:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef1f6;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px}
  .phone{width:420px;max-width:100%;background:var(--cream);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;height:calc(100vh - 40px)}
  .topbar{background:#fff;padding:14px 18px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px}
  .topbar h1{font-size:17px;font-weight:800}
  .badge{font-size:10px;font-weight:700;color:var(--green-d);background:#03c03c1f;padding:3px 8px;border-radius:4px}
  .body{flex:1;overflow-y:auto;padding:14px}

  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;height:50px;border:2px solid var(--line2);border-radius:8px;padding:0 14px 0 42px;font-size:16px;outline:none}
  .search input:focus{border-color:var(--blue)}
  .search svg{position:absolute;left:13px;top:15px;color:var(--muted)}
  .results{background:#fff;border:2px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
  .res{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
  .res:last-child{border-bottom:none}
  .res:active{background:#f1f5f9}
  .re{width:44px;height:44px;border-radius:7px;background:linear-gradient(135deg,#eef2f7,#dde6f2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .res .nm{flex:1;font-size:15px;font-weight:700}
  .res .sub{font-size:12px;color:var(--muted);font-weight:500}
  .res .pr{font-weight:800;font-size:14px}
  .res .plus{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

  .sech{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:4px 0 10px}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px;background:#fff;border:2px dashed var(--line2);border-radius:8px}
  .line{background:#fff;border:2px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
  .lhead{display:flex;align-items:center;gap:12px;padding:12px}
  .lhead .re{width:40px;height:40px;font-size:20px}
  .lhead .nm{flex:1;font-size:15px;font-weight:700}
  .lhead .rm{color:#ef4444;background:none;border:none;font-size:18px;cursor:pointer}
  .lopts{padding:0 12px 10px;display:flex;gap:8px;flex-wrap:wrap}
  .lopts select{flex:1;min-width:90px;height:42px;border:2px solid var(--line2);border-radius:6px;padding:0 10px;font-size:14px;font-weight:600;background:#fff;outline:none}
  .lopts select:focus{border-color:var(--blue)}
  .lfoot{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);background:#fafbfc}
  .stepper{display:flex;align-items:center;border:2px solid var(--line2);border-radius:7px;overflow:hidden;background:#fff}
  .stepper button{width:40px;height:40px;border:none;background:#fff;font-size:20px;cursor:pointer}
  .stepper span{width:36px;text-align:center;font-weight:800}
  .lt{font-weight:800;font-size:16px;font-family:monospace}

  .footer{background:#fff;border-top:2px solid var(--line);padding:14px 18px}
  .cust{font-size:14px;color:var(--blue);font-weight:700;margin-bottom:12px}
  .srow{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-bottom:12px}
  .create{width:100%;height:56px;border:none;border-radius:10px;background:var(--green);color:#fff;font-size:17px;font-weight:800;cursor:pointer}
  .create:active{background:var(--green-d)}
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar"><h1>Point of Sale</h1><span class="badge">DEMO C · Single column</span></div>
    <div class="body">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input placeholder="Search to add a product…" />
      </div>
      <div class="results" id="results"></div>
      <div class="sech">Order ticket</div>
      <div id="lines"><div class="empty">No items yet. Tap a result above.</div></div>
    </div>
    <div class="footer">
      <div class="cust">＋ Add customer details</div>
      <div class="srow"><span>Total</span><span id="tot">RM 0.00</span></div>
      <button class="create">Create order</button>
    </div>
  </div>

<script>
const products=[
  {id:1,n:"Dragon Keychain",p:25,e:"🐉",v:["S","M","L"],c:["Red","Blue","Green"]},
  {id:2,n:"Mini Ninja Figure",p:45,e:"🥷",v:["S","M","L"]},
  {id:3,n:"Custom Keyboard Clicker",p:40,e:"⌨️",cfg:true},
  {id:4,n:"Cat Planter Pot",p:38,e:"🐱"},
  {id:5,n:"Skull Dice Set",p:30,e:"💀",c:["Black","White","Glow"]},
];
const R=document.getElementById('results');
products.forEach(p=>{
  const d=document.createElement('div');d.className='res';
  const sub=p.cfg?'Configurable':p.v?'Variants':p.c?'Colours':'Simple';
  d.innerHTML=`<div class="re">${p.e}</div><div class="nm">${p.n}<div class="sub">${sub}</div></div><div class="pr">RM ${p.p.toFixed(2)}</div><div class="plus">＋</div>`;
  d.onclick=()=>add(p);
  R.appendChild(d);
});
const lines=[];
function add(p){lines.push({...p,qty:1});render();}
function render(){
  const L=document.getElementById('lines');
  if(!lines.length){L.innerHTML='<div class="empty">No items yet. Tap a result above.</div>';upd();return;}
  L.innerHTML='';
  lines.forEach((l,i)=>{
    const opts=[];
    if(l.v)opts.push(`<select>${l.v.map(x=>`<option>Size ${x}</option>`).join('')}</select>`);
    if(l.c)opts.push(`<select>${l.c.map(x=>`<option>${x}</option>`).join('')}</select>`);
    if(l.cfg)opts.push(`<select><option>Tap to set 3 fields ▾</option></select>`);
    const el=document.createElement('div');el.className='line';
    el.innerHTML=`
      <div class="lhead"><div class="re">${l.e}</div><div class="nm">${l.n}</div><button class="rm" onclick="rm(${i})">✕</button></div>
      ${opts.length?`<div class="lopts">${opts.join('')}</div>`:''}
      <div class="lfoot"><div class="stepper"><button onclick="q(${i},-1)">−</button><span>${l.qty}</span><button onclick="q(${i},1)">+</button></div><div class="lt">RM ${(l.p*l.qty).toFixed(2)}</div></div>`;
    L.appendChild(el);
  });
  upd();
}
function q(i,d){lines[i].qty=Math.max(1,lines[i].qty+d);render();}
function rm(i){lines.splice(i,1);render();}
function upd(){const s=lines.reduce((a,l)=>a+l.p*l.qty,0);document.getElementById('tot').textContent='RM '+s.toFixed(2);}
</script>
</body>
</html>
